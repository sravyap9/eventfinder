name: train-model
on:
  schedule:
    - cron: "17 9 * * 1"   # Mondays
  workflow_dispatch:
permissions:
  contents: write   # only to commit model.json
concurrency:
  group: train-model
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Export ratings and train
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "Supabase secrets are not set, nothing to train yet."
            exit 0
          fi
          python ml/export.py ratings.json
          python ml/train.py --ratings ratings.json --out model.json
          rm -f ratings.json
      - name: Commit the model if it changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add model.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Retrain shared model" && git push)
