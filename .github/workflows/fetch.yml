name: fetch-events
on:
  schedule:
    - cron: "0 11,23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Random start delay (scheduled runs only)
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 600))
      - run: python fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add events.json
          git diff --staged --quiet || git commit -m "Update events" && git push
